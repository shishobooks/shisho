name: Demo

# Deploys the Public Demo. The Release workflow calls this after the Docker
# manifest is published, because releases are created with GITHUB_TOKEN and
# GitHub does not start workflows from events that token causes.
on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy (for example v0.0.51). Defaults to the latest release."
        required: false
        type: string
  repository_dispatch:
    types:
      - demo-corpus-updated

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

env:
  # First release that includes Demo Mode. Anything older ignores DEMO_MODE and
  # would come up fully writable with the corpus's published admin password.
  DEMO_MIN_VERSION: v0.0.51

jobs:
  deploy:
    name: Deploy Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the Demo Corpus
        uses: actions/checkout@v7
        with:
          repository: shishobooks/demo-corpus
          ref: master
          path: demo/corpus

      - name: Resolve the release to deploy
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            tag="$INPUT_VERSION"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          tag="v${tag#v}"
          lowest=$(printf '%s\n%s\n' "$DEMO_MIN_VERSION" "$tag" | sort -V | head -n1)
          if [ "$lowest" != "$DEMO_MIN_VERSION" ]; then
            echo "::error::$tag predates $DEMO_MIN_VERSION, the first release with Demo Mode. Refusing to deploy a writable instance."
            exit 1
          fi
          # The multi-arch manifest on ghcr.io is tagged without the "v" prefix.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying Shisho $tag (ghcr.io/shishobooks/shisho:${tag#v})"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        working-directory: demo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          flyctl deploy \
            --config fly.toml \
            --dockerfile Dockerfile \
            --build-arg "SHISHO_VERSION=$IMAGE_TAG" \
            --remote-only \
            --ha=false
