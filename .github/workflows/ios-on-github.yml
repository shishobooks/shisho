name: iOS on GitHub

# For a pull request labelled ios-on-github: runs the iOS unit tests and
# flows on GitHub's runners and posts the "iOS signoff" status that CI OK
# (ci.yml) waits for, in place of `mise ios:signoff`, for when a
# maintainer's Mac can't run them. They check the pull request's own commit,
# which the status names, as the signoff does. Only accounts with write
# access can label; forks and Dependabot run the checks in CI already, so
# the label does nothing for them. A workflow of its own so that other
# labels don't restart CI.

on:
  pull_request:
    branches: [master]
    types: [labeled, synchronize]

# Another label's event gets a group of its own, so it never cancels a run
# going for this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ios-on-github' && github.run_id || 'checks' }}
  cancel-in-progress: true

jobs:
  checks:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ios-on-github') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ios-on-github')
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  signoff:
    name: Post the iOS signoff
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - name: Post the signoff and rerun a CI OK that gave up waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context="iOS signoff" \
            -f description="Every iOS unit test and Maestro flow passed on GitHub's runners (ios-on-github)"
          # The status is posted; CI OK can still be rerun by hand.
          go run ./tools/appharness rerun-ci-ok "$SHA" ||
            echo "::warning::Couldn't rerun CI OK; rerun it by hand if it gave up waiting."
