name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

env:
  SHARD_TOTAL: 2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # mise lint runs scripts/check-emdash.sh, which needs master's
          # history to find the merge base.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # Only master saves Go caches, so PR runs never evict the shared ones.
      - name: Restore Go and golangci-lint caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
            tmp/golangci-lint-cache
          key: go-lint-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-
      - run: mise lint
        env:
          # Keeps the cache at the path the restore and save steps use.
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/tmp/golangci-lint-cache
      - run: mise test:scripts
      - name: Save Go and golangci-lint caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # A re-run on the same SHA finds the key taken.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
            tmp/golangci-lint-cache
          key: go-lint-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  test:
    # Keep this N in sync with env.SHARD_TOTAL (env not available in name).
    name: Go Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TZ: America/Chicago
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        # gotestsplit compiles every package with -race on every shard to list
        # the tests, so one cache serves every shard. Shard 1 saves it on
        # master only.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-race-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-
      - name: Restore test timing cache
        # Restore-only — saving is consolidated across shards in the
        # consolidate-test-timings job below. If we used actions/cache here,
        # all shards would race to save, and only one shard's JUnit data
        # would survive — defeating timing-aware bin-packing.
        # Every shard must restore the same cache: each runs Pack on its own,
        # and different histories give divergent plans that skip or repeat
        # tests. Keys are immutable and include github.sha, so a re-run on the
        # same SHA fails the consolidator's save step; that is expected. Never
        # add github.run_attempt to the key, which fragments the cache.
        uses: actions/cache/restore@v6
        with:
          path: .gotest-timings
          key: gotest-timings-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            gotest-timings-${{ github.ref }}-
            gotest-timings-refs/heads/master-
      - name: Run tests
        # -count=1 keeps the restored build cache from replaying master's test
        # results, so every test still runs under -race on every run. ./...
        # covers cmd/, internal/, and tools/ too, not just pkg/.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go run ./tools/gotestsplit run \
            -junit-dir=.gotest-timings \
            -junit-out=.gotest-timings-fresh \
            -total=$SHARD_TOTAL -index=$((SHARD - 1)) \
            ./... -- -race -count=1
      - name: Upload shard JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gotest-timings-shard-${{ matrix.shard }}
          path: .gotest-timings-fresh/
          retention-days: 1
          # Dot-prefixed dir; without this flag upload-artifact uploads zero files.
          include-hidden-files: true
          # Catch go test crashing before any junit is written.
          if-no-files-found: error
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == 1
        # A re-run on the same SHA finds the key taken.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-race-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  consolidate-test-timings:
    name: Consolidate test timings
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/gotestsplit
            go.mod
            go.sum
      - name: Restore previous test timing cache
        # Preserves shard history when a shard fails before writing junit
        # or upload-artifact fails — fresh artifacts overlay on top.
        uses: actions/cache/restore@v6
        with:
          path: .gotest-timings
          key: gotest-timings-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            gotest-timings-${{ github.ref }}-
            gotest-timings-refs/heads/master-
      - name: Download all shard JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          path: .gotest-timings
          pattern: gotest-timings-shard-*
          merge-multiple: true
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - name: Prune stale junit files
        run: go run ./tools/gotestsplit prune -junit-dir=.gotest-timings -total=$SHARD_TOTAL
      - name: Report cache size
        # Visibility check — a sudden drop beyond what prune removes means
        # the merge-race bug or fresh-only upload assumption regressed.
        run: |
          echo "junit files: $(find .gotest-timings -name 'junit-*.xml' | wc -l)"
          du -sh .gotest-timings || true
      - name: Save consolidated cache
        uses: actions/cache/save@v6
        with:
          path: .gotest-timings
          key: gotest-timings-${{ github.ref }}-${{ github.sha }}

  # Builds both architectures once; image-smoke runs this same archive on
  # native runners, so smoke jobs never rebuild or emulate.
  image-build:
    name: Image Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Go and Node cross-compile natively; QEMU is only for the final arm64
      # stage's package installation and user setup.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=image-smoke
          outputs: type=oci,dest=${{ runner.temp }}/shisho.tar
          cache-from: type=gha,scope=image-smoke
          # Only master warms the shared cache. PRs and release tags read it.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'type=gha,mode=max,scope=image-smoke' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: shisho-image
          path: ${{ runner.temp }}/shisho.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  image-smoke:
    name: Image Smoke (${{ matrix.arch }})
    needs: image-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shisho-image
          path: ${{ runner.temp }}
      - name: Load the built image on its native runner
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$MACHINE"
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          skopeo copy --override-os linux --override-arch "$ARCH" \
            "oci-archive:${RUNNER_TEMP}/shisho.tar" docker-daemon:shisho:smoke
          test "$(docker image inspect --format '{{.Architecture}}' shisho:smoke)" = "$ARCH"
      - name: Verify container startup and embedded frontend
        run: |
          docker run -d --name shisho-smoke \
            -p 127.0.0.1:5173:5173 \
            -e JWT_SECRET=ci-image-smoke-test-secret-at-least-32-chars \
            -e PUID=1234 -e PGID=2345 \
            shisho:smoke

          ready=false
          for _ in $(seq 1 120); do
            if [ "$(docker inspect --format '{{.State.Running}}' shisho-smoke)" != true ]; then
              echo "Container exited before becoming ready"
              exit 1
            fi
            status=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/health || true)
            if [ "$status" = 200 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Container did not become ready within 120 attempts"
            exit 1
          fi

          status=$(curl -sS --max-time 5 -D /tmp/shisho-headers -o /tmp/shisho-index.html -w '%{http_code}' http://127.0.0.1:5173/)
          test "$status" = 200
          grep -qi '^content-type: text/html' /tmp/shisho-headers
          grep -q '<div id="root"></div>' /tmp/shisho-index.html
          grep -q 'src="/assets/[^" ]*\.js"' /tmp/shisho-index.html
          grep -q 'href="/assets/[^" ]*\.css"' /tmp/shisho-index.html
          # Open tabs compare the server's build header with the page's meta tag
          # to notice an upgrade; both sides must agree on the embedded build.
          build=$(sed -n 's/.*<meta name="shisho-build" content="\([0-9a-f]*\)".*/\1/p' /tmp/shisho-index.html)
          test -n "$build"
          grep -qi "^x-shisho-build: $build" /tmp/shisho-headers
          for asset in $(grep -oE '(src|href)="/assets/[^" ]+\.(js|css)"' /tmp/shisho-index.html | cut -d '"' -f 2); do
            curl --fail --silent --show-error --max-time 10 \
              -D /tmp/shisho-asset-headers "http://127.0.0.1:5173${asset}" -o /tmp/shisho-asset
            test -s /tmp/shisho-asset
            case "$asset" in
              *.js) grep -Eqi '^content-type: (text|application)/javascript([;[:space:]]|$)' /tmp/shisho-asset-headers ;;
              *.css) grep -Eqi '^content-type: text/css([;[:space:]]|$)' /tmp/shisho-asset-headers ;;
            esac
          done
          docker logs shisho-smoke > /tmp/shisho-smoke.log 2>&1
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"image-smoke"' /tmp/shisho-smoke.log
          test "$(docker exec shisho-smoke cat /proc/1/comm)" = shisho
          docker exec shisho-smoke grep -Eq '^Uid:[[:space:]]+1234[[:space:]]+1234[[:space:]]+1234[[:space:]]+1234$' /proc/1/status
          docker exec shisho-smoke grep -Eq '^Gid:[[:space:]]+2345[[:space:]]+2345[[:space:]]+2345[[:space:]]+2345$' /proc/1/status
          test "$(docker exec shisho-smoke stat -c '%u:%g' /config)" = 1234:2345
          docker stop --timeout 10 shisho-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' shisho-smoke)" = 0
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs shisho-smoke || true
          docker rm -f shisho-smoke || true

  lint-js:
    name: JS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: mise tygo
      - run: mise lint:js

  # Runs on every PR with no path filter. The Docusaurus build can break
  # from dependency bumps that only touch the root pnpm-lock.yaml (e.g. a
  # dependabot bump of @docusaurus/* that misses a new required peer), so
  # filtering on website/** would reintroduce the gap this job exists to
  # close. Do not add a paths-ignore here. The docs e2e config builds the
  # site before serving it, so it is the build check too.
  docs-build:
    name: Docs Build and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-playwright
        with:
          browser: chromium
      - run: pnpm e2e:docs

  test-js:
    name: JS Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: mise tygo
      - run: pnpm test:unit

  # Each browser runs its own API server and Vite dev server, so neither
  # needs the production build; Image Build covers that. Each browser runs
  # on two shards. Playwright splits by test count, not time, and keeps a
  # file on one shard, so check the shards stay close after moving many
  # tests between files.
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        # The total, 2, is also in the job name and in SHARD below.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        # The first Chromium shard saves it on master only.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-
      - run: go mod download
      - run: mise tygo
      - name: Run E2E
        uses: nick-fields/retry@v4
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}/2
        with:
          # A backstop for a hung run, well above how long a shard takes
          # (each browser's whole suite takes 8 to 9 minutes).
          # Playwright's own 18-minute globalTimeout (playwright.config.ts)
          # stops a hung suite first and names the tests still running; a
          # timeout here means even that failed.
          timeout_minutes: 20
          max_attempts: 2
          retry_on: timeout
          command: pnpm "e2e:$BROWSER" --shard="$SHARD"
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.browser == 'chromium' && matrix.shard == 1
        # A re-run on the same SHA finds the key taken.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Real KOReader, in Docker, against a test server. Separate from the Go test
  # job because it needs Docker and downloads a release, which is cached. The
  # key names the file that pins the version.
  koreader-harness:
    name: KOReader Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        # The first Chromium E2E shard saves it on master only.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-
      - name: Cache the KOReader release
        uses: actions/cache@v6
        with:
          path: tmp/koreader/release
          key: koreader-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/koreaderharness/harness.go') }}
      - run: mise test:koreader

  # Whether a pull request touches what the Shisho app's jobs test, which
  # is anything scripts/app-changes.sh doesn't rule out. Pushes to master
  # and release runs always run them.
  #
  # And whether its iOS unit tests and flows pass by signoff
  # (tools/appharness/signoff.go): a pull request from this repository's own
  # branches, other than Dependabot's, runs them on a maintainer's Mac with
  # `mise ios:signoff`, several times faster than GitHub's macOS runners. Forks and Dependabot
  # run them here, and so does every push to master, as the backstop. The
  # signoff tests the pull request's own commit, not its merge with master,
  # so a clash with master's app changes shows only in that backstop run.
  # The ios-on-github label stands in for the signoff when the Mac can't
  # run the iOS checks (ios-on-github.yml).
  app-changes:
    name: Shisho app changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      signoff: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" | scripts/app-changes.sh)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # The Shisho app's checks: the generated API types' decode tests on both
  # platforms, the iOS unit tests and build, and the Maestro flows against a
  # seeded server.
  app-android:
    name: Android API types
    needs: app-changes
    if: needs.app-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise android:test

  # The iOS unit tests and flows, on GitHub's runners only when the pull
  # request doesn't pass them by signoff (app-changes above).
  app-ios:
    name: iOS
    needs: app-changes
    if: needs.app-changes.outputs.changed == 'true' && needs.app-changes.outputs.signoff != 'true'
    uses: ./.github/workflows/ios.yml

  # The one check branch protection requires, so the shard count and job
  # names can change without editing protection. A job added above that
  # should block merges goes in needs.
  ci-ok:
    name: CI OK
    needs:
      - lint
      - test
      - image-build
      - image-smoke
      - lint-js
      - docs-build
      - test-js
      - e2e
      - koreader-harness
      - app-changes
      - app-android
      - app-ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed, except that the Shisho app's are skipped
      # when a pull request doesn't touch what they test, and the iOS checks
      # when they pass by signoff instead.
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          APP_CHANGED: ${{ needs.app-changes.outputs.changed }}
          SIGNOFF: ${{ needs.app-changes.outputs.signoff }}
        run: |
          jq -e --arg app "$APP_CHANGED" --arg signoff "$SIGNOFF" '
            to_entries | all(
              .value.result == "success"
              or (.value.result == "skipped" and $app == "false" and (.key | startswith("app-")) and .key != "app-changes")
              or (.value.result == "skipped" and $signoff == "true" and .key == "app-ios")
            )' <<< "$NEEDS"
      # `mise ios:signoff` posts this status once every unit test and flow
      # passes on the commit. A run started after the push often lands after the other
      # jobs, so this waits for it rather than failing, which would send a
      # failure email for nearly every pull request. A signoff that comes
      # later still reruns this job. Polled once a minute: a signoff takes
      # far longer, and every job's GITHUB_TOKEN shares one hourly budget.
      - name: Wait for the iOS signoff
        if: needs.app-changes.outputs.changed == 'true' && needs.app-changes.outputs.signoff == 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::notice::Waiting up to 45 minutes for \`mise ios:signoff\` on $SHA, or the ios-on-github label."
          deadline=$((SECONDS + 45 * 60))
          while :; do
            if state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq '.statuses[] | select(.context == "iOS signoff") | .state'); then
              if [ "$state" = success ]; then
                exit 0
              fi
            else
              echo "Couldn't read the commit's statuses; trying again."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No iOS signoff on $SHA. Run \`mise ios:signoff\` on this commit, on a Mac; it posts the signoff and reruns this job. If the Mac can't pass the iOS checks, the ios-on-github label runs them on GitHub's runners."
              exit 1
            fi
            sleep 60
          done
