name: Save the base simulator
description: >-
  Save the harness's base simulator for later runs, when setup-ios didn't
  restore it. The base is shut down and never booted after it's made, so
  the copy is clean.

inputs:
  key:
    description: setup-ios's simulator-key output.
    required: true
  hit:
    description: setup-ios's simulator-hit output.
    required: true
  name:
    description: setup-ios's simulator-name output.
    required: true

runs:
  using: composite
  steps:
    - name: Copy the base simulator
      id: copy
      if: inputs.hit != 'true'
      shell: bash
      env:
        BASE: ${{ inputs.name }}
      run: |
        udid=$(xcrun simctl list devices -j | jq -r --arg name "$BASE" '.devices[][] | select(.name == $name) | .udid' | head -n 1)
        if [ -z "$udid" ]; then
          echo "No base simulator to save."
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/ios-base-simulator"
        cp -R "$HOME/Library/Developer/CoreSimulator/Devices/$udid" "$RUNNER_TEMP/ios-base-simulator/"
        echo "copied=true" >> "$GITHUB_OUTPUT"
    - name: Save the base simulator
      if: steps.copy.outputs.copied == 'true'
      # The other iOS job may have saved it first.
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ios-base-simulator
        key: ${{ inputs.key }}
