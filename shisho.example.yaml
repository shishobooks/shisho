# Shisho Configuration File
#
# Copy this file to /config/shisho.yaml (or set CONFIG_FILE env var to point elsewhere)
#
# All settings can also be configured via environment variables.
# Environment variables use uppercase with underscores (e.g., DATABASE_FILE_PATH).
# Environment variables take precedence over config file values.
# List settings take comma-separated values as environment variables.
# Durations use Go's format with a unit (500ms, 5s, 1m); a bare number is
# nanoseconds, so values below 1ms are rejected.
# Shisho refuses to start if a setting is invalid, naming the setting and range.
# Logging is set with LOG_FORMAT (json or console) and LOG_LEVEL (debug, info,
# warn or error; default info), which are environment variables only.

# =============================================================================
# DATABASE SETTINGS
# =============================================================================

# Path to the SQLite database file
# Env: DATABASE_FILE_PATH
# Default: /config/shisho.db
database_file_path: /config/shisho.db

# Log every SQL statement, with parameter values, at debug level.
# Very verbose, and exposes stored values such as password hashes and share
# tokens to Settings > Logs. Enable briefly for troubleshooting.
# Queries slower than 250 ms are always logged as warnings without their values.
# Env: DATABASE_DEBUG
# Default: false
database_debug: false

# Total number of connection attempts on startup, including the first.
# 0 skips the startup connection check. Minimum: 0
# Env: DATABASE_CONNECT_RETRY_COUNT
# Default: 5
database_connect_retry_count: 5

# Delay between connection attempts (a duration). Minimum: 1ms
# Env: DATABASE_CONNECT_RETRY_DELAY
# Default: 2s
database_connect_retry_delay: 2s

# SQLite busy timeout: how long to wait when the database is locked
# (a duration). Minimum: 1ms
# Env: DATABASE_BUSY_TIMEOUT
# Default: 5s
database_busy_timeout: 5s

# Maximum number of retries for database operations on busy/locked errors.
# 0 means one attempt with no retries. Minimum: 0
# Env: DATABASE_MAX_RETRIES
# Default: 5
database_max_retries: 5

# =============================================================================
# SERVER SETTINGS
# =============================================================================

# Address to bind the HTTP listener to. Use 127.0.0.1 for local-only access.
# Keep 0.0.0.0 inside Docker so published ports can reach Shisho.
# Env: SERVER_HOST
# Default: 0.0.0.0
server_host: 0.0.0.0

# Port for both the web interface and API
# The production image sets SERVER_PORT=5173, overriding this YAML value.
# Env: SERVER_PORT
# Default: 3689
server_port: 3689

# =============================================================================
# APPLICATION SETTINGS
# =============================================================================

# Present a prepared library without allowing API edits, even by admins.
# Disables background work, plugins, and integrations, and hides the original,
# KePub, supplement, and bulk download controls.
# Reading and audio streaming remain available. Set up users and media first.
# Env: DEMO_MODE
# Default: false
demo_mode: false

# How often to scan libraries for new content (in minutes)
# The first scheduled scan runs one interval after startup.
# Set to 0 to disable scheduled scans
# Env: SYNC_INTERVAL_MINUTES
# Default: 60
sync_interval_minutes: 60

# Number of background workers that run jobs at the same time. Minimum: 1
# Env: WORKER_PROCESSES
# Default: 2
worker_processes: 2

# How many days to keep completed and failed jobs, with their logs.
# An hourly cleanup deletes jobs created longer ago than this.
# Set to 0 to disable retention cleanup
# Env: JOB_RETENTION_DAYS
# Default: 30
job_retention_days: 30

# =============================================================================
# CACHE SETTINGS
# =============================================================================

# Directory for caching generated files
# This includes:
#   - {cache_dir}/downloads/  Generated download files with embedded metadata
#   - {cache_dir}/cbz/        Extracted CBZ page images for the comic viewer
#   - {cache_dir}/pdf/        Rendered PDF page images for the PDF viewer
#   - {cache_dir}/cover-thumbnails/  Cover sizes generated on demand (256 MiB limit)
# Env: CACHE_DIR
# Default: /config/cache
cache_dir: /config/cache

# Maximum size of the download cache in GiB (1 GiB = 1024^3 bytes)
# After each generated download, if the cache is over this size, the least
# recently used files are removed until it is at 80% of it.
# 0 removes every cached download after each generation.
# Env: DOWNLOAD_CACHE_MAX_SIZE_GB
# Default: 5
download_cache_max_size_gb: 5

# DPI for rendering PDF pages in the viewer (higher = sharper but larger images)
# Range: 72-600. At 200 DPI, a typical letter-size page renders to ~1700x2200 pixels.
# Rendered pages are stored per setting, so pages render again after a change.
# Env: PDF_RENDER_DPI
# Default: 200
pdf_render_dpi: 200

# JPEG quality for rendered PDF pages (higher = better quality but larger files)
# Range: 1-100. Pages render again after a change.
# Env: PDF_RENDER_QUALITY
# Default: 85
pdf_render_quality: 85

# =============================================================================
# PLUGIN SETTINGS
# =============================================================================

# Directory where installed plugins are stored
# Env: PLUGIN_DIR
# Default: /config/plugins/installed
plugin_dir: /config/plugins/installed

# Directory where plugin persistent data is stored (caches, tokens, DB files)
# Data survives plugin updates and normal uninstalls
# Env: PLUGIN_DATA_DIR
# Default: /config/plugins/data
plugin_data_dir: /config/plugins/data

# =============================================================================
# ENRICHMENT SETTINGS
# =============================================================================

# Confidence threshold for automatic metadata enrichment during scans.
# When a plugin returns a confidence score with search results, results
# below this threshold are skipped. Range: 0 to 1 (0.85 = 85%).
# Per-plugin thresholds can override this in plugin settings.
# Env: ENRICHMENT_CONFIDENCE_THRESHOLD
# Default: 0.85
enrichment_confidence_threshold: 0.85

# =============================================================================
# LIBRARY MONITOR SETTINGS
# =============================================================================

# Enable real-time filesystem monitoring of library paths
# When enabled, file changes (create, modify, delete) are detected automatically
# and trigger targeted rescans without requiring a full library scan.
# Disable if your library is on a network drive that doesn't support inotify/FSEvents.
# On Linux, large libraries may require increasing the inotify watch limit:
#   sysctl -w fs.inotify.max_user_watches=524288
# Or persist via /etc/sysctl.d/99-inotify.conf
# Env: LIBRARY_MONITOR_ENABLED
# Default: true
library_monitor_enabled: true

# Delay in seconds before processing detected filesystem changes
# When a change is detected, the monitor waits this long before acting.
# If more changes occur during the wait, the timer resets, which batches
# rapid changes (e.g., copying multiple files) into a single rescan.
# Values below 5 are raised to 5.
# Env: LIBRARY_MONITOR_DELAY_SECONDS
# Default: 60
library_monitor_delay_seconds: 60

# =============================================================================
# SUPPLEMENT DISCOVERY SETTINGS
# =============================================================================

# Patterns to exclude from supplement discovery (glob patterns)
# These files will not be picked up as supplements even if they're in book directories.
# Matching files are only skipped, never deleted. When a directory is left
# with no tracked files, Shisho removes it only if what remains is hidden
# files, Thumbs.db, desktop.ini, or its own covers and sidecars; this fixed
# list is separate from these patterns.
# Env: SUPPLEMENT_EXCLUDE_PATTERNS (comma-separated)
# Default: [".*", ".DS_Store", "Thumbs.db", "desktop.ini"]
supplement_exclude_patterns:
  - ".*" # hidden files (dotfiles)
  - ".DS_Store"
  - "Thumbs.db"
  - "desktop.ini"

# PDF basenames (case-insensitive, no extension) that should be auto-classified
# as supplements when discovered in a book directory with a non-PDF main file.
# A root-level PDF always imports as a main file regardless of name.
# Set to [] to disable. Substring matches are NOT applied; exact basename only.
# Env: PDF_SUPPLEMENT_FILENAMES (comma-separated)
# Default: see list below
pdf_supplement_filenames:
  - "supplement"
  - "supplemental"
  - "bonus"
  - "bonus material"
  - "bonus content"
  - "companion"
  - "notes"
  - "liner notes"
  - "errata"
  - "booklet"
  - "digital booklet"
  - "appendix"
  - "map"
  - "maps"
  - "insert"
  - "guide"
  - "reference"
  - "cheat sheet"
  - "cheatsheet"
  - "cribsheet"
  - "pamphlet"
  - "extras"

# =============================================================================
# AUTHENTICATION SETTINGS
# =============================================================================

# REQUIRED: Secret key for signing JWT tokens
# Use at least 32 characters. Generate one with: openssl rand -hex 32
# Replace the placeholder below: Shisho refuses to start with it, because it
# is public and would let anyone forge a login session. A shorter secret
# still starts but logs a warning and shows one on Settings > Server.
# Changing the secret signs everyone out once.
# Env: JWT_SECRET
jwt_secret: your-secret-key-here-change-me

# How many days a login session remains valid before requiring re-authentication
# Env: SESSION_DURATION_DAYS
# Default: 30
session_duration_days: 30
