version: 2
project_name: shisho

builds:
  - skip: true

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - typo
      - merge conflict
  groups:
    # Breaking changes are not a group here on purpose. GoReleaser only sees
    # commit subjects, so a group would list the "[Fix]! ..." subject a second
    # time without its notes. The release header that
    # scripts/release-notes-header.sh generates in CI already carries the
    # version's Breaking Changes block from CHANGELOG.md, notes included.
    - title: "Features"
      regexp: '^.*?\[(?:Frontend|Backend|Feature|Feat)\].*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?\[Fix\].*$'
      order: 1
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: shishobooks
    name: shisho
  draft: false
  prerelease: auto
  mode: replace
  # The header (install block plus the version's Breaking Changes from
  # CHANGELOG.md) is generated by scripts/release-notes-header.sh and passed
  # with --release-header-tmpl in .github/workflows/release.yml.
  footer: |
    **Full Changelog**: https://github.com/shishobooks/shisho/compare/{{ .PreviousTag }}...{{ .Tag }}

    **npm package**: `npm install @shisho/plugin-sdk@{{ trimprefix .Tag "v" }}`
