version: 2
project_name: shisho

builds:
  - skip: true

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - typo
      - merge conflict
  groups:
    # A "!" after the category marks a breaking change ("[Fix]! Rename the
    # key"). Groups are matched in this order, so the breaking group must stay
    # first. GoReleaser only sees commit subjects; the upgrade notes written
    # under "## BREAKING CHANGES" in the PR body reach the release page through
    # the header file that scripts/release-notes-header.sh generates in CI.
    - title: "Breaking Changes"
      regexp: '^.*?\[[^\]]+\]!.*$'
      order: 0
    - title: "Features"
      regexp: '^.*?\[(?:Frontend|Backend|Feature|Feat)\].*$'
      order: 1
    - title: "Bug Fixes"
      regexp: '^.*?\[Fix\].*$'
      order: 2
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: shishobooks
    name: shisho
  draft: false
  prerelease: auto
  mode: replace
  # The header (install block plus the version's Breaking Changes from
  # CHANGELOG.md) is generated by scripts/release-notes-header.sh and passed
  # with --release-header-tmpl in .github/workflows/release.yml.
  footer: |
    **Full Changelog**: https://github.com/shishobooks/shisho/compare/{{ .PreviousTag }}...{{ .Tag }}

    **npm package**: `npm install @shisho/plugin-sdk@{{ trimprefix .Tag "v" }}`
