version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - decorder
    - depguard
    - dogsled
    - dupword
    - err113
    - errcheck
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - goheader
    - gosec
    - govet
    - grouper
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - misspell
    - noctx
    - nosprintfhostport
    - perfsprint
    - predeclared
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        # gotestsplit must stay extractable into its own repo.
        gotestsplit:
          list-mode: strict
          files:
            - "**/tools/gotestsplit/**"
          allow:
            - $gostd
            - github.com/jstemmer/go-junit-report/v2
    forbidigo:
      analyze-types: true
      forbid:
        # The authenticated user lives under one echo context key that only
        # pkg/auth reads and writes. A handler that reads it directly can skip
        # the check when no user is set, so it uses auth.RequireUser,
        # auth.RequireLibraryAccessFor, and auth.SetUser (tests) instead.
        - pattern: ^echo\.Context\.(Get|Set)$
          pkg: ^github\.com/labstack/echo/v4$
          msg: use auth.RequireUser, auth.RequireLibraryAccessFor or auth.SetUser (apikeys.RequireKey for the API key) instead of reading or writing echo context values
        # c.File (which c.Attachment and c.Inline wrap) and http.ServeFile turn
        # every open failure, a permission error included, into a 404, and
        # headers set before them ride on the error response. httputil.ServeFile
        # returns 404 only for a missing file and sets headers after the open.
        - pattern: ^echo\.Context\.(File|Attachment|Inline)$
          pkg: ^github\.com/labstack/echo/v4$
          msg: use httputil.ServeFile with its options instead of c.File, c.Attachment or c.Inline
        - pattern: ^http\.ServeFile(FS)?$
          pkg: ^net/http$
          msg: use httputil.ServeFile with its options instead of http.ServeFile
        # Some NAS storage (ZFS with aclmode=restricted) refuses every chmod,
        # and a chmod also overrides the operator's umask. Files and
        # directories get their mode at creation instead. See "File Modes Are
        # Set at Creation" in pkg/AGENTS.md.
        - pattern: ^os\.(File\.)?Chmod$
          pkg: ^os$
          msg: create the file with its mode instead (fileutils.CreateTemp, fileutils.MkdirTemp, os.OpenFile or os.WriteFile)
        # os.CreateTemp always creates 0600, which would need a chmod.
        - pattern: ^os\.CreateTemp$
          pkg: ^os$
          msg: use fileutils.CreateTemp(dir, pattern, perm), which sets the mode at creation
        # The error handler snake-cases an echo.HTTPError message into its wire
        # code, so every call site would invent a code.
        - pattern: ^echo\.NewHTTPError$
          pkg: ^github\.com/labstack/echo/v4$
          msg: return an errcodes constructor (errcodes.NotFound, ValidationError, InvalidState, Forbidden, Conflict, ...) instead of echo.NewHTTPError
        # migrations.NewMigrator enables WithMarkAppliedOnSuccess, so a failed
        # migration is not recorded as applied.
        - pattern: ^migrate\.NewMigrator$
          pkg: ^github\.com/uptrace/bun/migrate$
          msg: use migrations.NewMigrator, which marks a migration applied only after it succeeds
        # echo.NotFoundHandler is a process-wide global: setting it leaks into
        # every Echo instance (parallel tests included) and is bypassed by the
        # authenticated fallbacks Group.Use adds. pkg/server registers
        # per-router RouteNotFound handlers instead.
        - pattern: ^echo\.NotFoundHandler$
          pkg: ^github\.com/labstack/echo/v4$
          msg: register a per-router e.RouteNotFound handler instead of using echo.NotFoundHandler
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${base-path}/tools/ruleguard/rules.go
          failOn: all
      disabled-checks:
        - appendAssign
        - ifElseChain
        - singleCaseSwitch
    gosec:
      excludes:
        - G108 # Profiling endpoint is automatically exposed
        - G114 # ListenAndServe is used for internal APIs only
        - G401 # Use of weak cryptographic primitive
        - G404 # Use of weak random number generator
        - G501 # Blocklisted import crypto/md5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # It's complaining about InsecureSkipVerify being set to true, but we are
      # setting it to true intentionally if the host is localhost.
      - path: pkg/database/database.go
        text: G402 # Checking for InsecureSkipVerify
      # pkg/httputil and pkg/version intentionally share names with standard
      # library packages; they're always imported by their full module path.
      - linters:
          - revive
        text: avoid package names that conflict with Go standard library package names
      # These packages own the echo context values they read and write.
      - linters:
          - forbidigo
        path: ^pkg/(auth|apikeys|binder)/
        text: echo context values
      - linters:
          - forbidigo
        path: ^pkg/server/http_middleware\.go$
        text: echo context values
      # fileutils.CreateTemp is the sanctioned wrapper around os.CreateTemp's
      # naming rules, and tests create throwaway files whose mode is irrelevant.
      - linters:
          - forbidigo
        path: (^pkg/fileutils/|_test\.go)
        text: os\.CreateTemp
      # pkg/migrations owns the one sanctioned migrate.NewMigrator call.
      - linters:
          - forbidigo
        path: ^pkg/migrations/migrations\.go$
        text: migrate\.NewMigrator
      # Tests chmod their fixtures, for example to inject permission faults.
      - linters:
          - forbidigo
        path: _test\.go
        text: Chmod
      # IsUniqueViolation is the one sanctioned message match: sqliteshim picks
      # mattn or modernc SQLite by build, and each has its own error type.
      - linters:
          - gocritic
        path: ^pkg/database/unique\.go$
        text: errors\.Is or errors\.As
      # Tests may assert on the wording of a user-facing error message.
      - linters:
          - gocritic
        path: _test\.go
        text: errors\.Is or errors\.As
      # Kobo responses pass through the Kobo store protocol's JSON, whose
      # shapes the device defines and the frontend never reads.
      - linters:
          - gocritic
        path: ^pkg/kobo/
        text: named response struct
      # The routing test reads the global to prove server construction leaves
      # it alone.
      - linters:
          - forbidigo
        path: ^pkg/server/server_test\.go$
        text: echo\.NotFoundHandler
      # Ignore a bunch of linters for test files.
      - linters:
          - err113
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
