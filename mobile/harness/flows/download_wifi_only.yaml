# With Wi-Fi only on, a Download waits while the device is on cellular, and
# goes once Wi-Fi only is off (#915). The Simulator is never on cellular, so
# a debug build launched with harnessNetwork treats its network as cellular.
appId: ${APP_ID}
name: Wi-Fi only keeps Downloads off cellular
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp:
    clearState: true
    permissions: {}
    arguments:
      harnessServer: ${SERVER}
      harnessUsername: ${USERNAME}
      harnessPassword: ${PASSWORD}
      harnessNetwork: cellular
- extendedWaitUntil:
    visible:
      id: account.button
    timeout: 90000

- tapOn:
    id: tab.downloads
- tapOn:
    id: downloads.wifiOnly
- extendedWaitUntil:
    visible:
      id: downloads.wifiOnly.note
      text: Downloads wait until you're on Wi-Fi.
    timeout: 30000

- tapOn:
    id: tab.library
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: Harbor Lights
- scrollUntilVisible:
    element:
      id: file\.download\.[0-9]+
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: file\.download\.[0-9]+
- extendedWaitUntil:
    visible:
      id: file\.downloadStatus\.[0-9]+
      text: Waiting for Wi-Fi
    timeout: 30000
# Long enough for the small File to have downloaded, were it going.
- extendedWaitUntil:
    visible: __never__
    timeout: 5000
    optional: true
- assertVisible:
    id: file\.downloadStatus\.[0-9]+
    text: Waiting for Wi-Fi

# Wi-Fi only off: the Download goes.
- tapOn:
    id: tab.downloads
- tapOn:
    id: downloads.wifiOnly
- tapOn:
    id: tab.library
- extendedWaitUntil:
    visible:
      id: file\.downloadStatus\.[0-9]+
      text: Downloaded
    timeout: 60000
