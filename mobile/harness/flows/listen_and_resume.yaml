# Listen, kill the app while it plays, and relaunch: it resumes where it was,
# and the server has the place too (#912).
appId: ${APP_ID}
name: Listen, kill, and resume
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
# Another flow may have listened already: start from the beginning.
- runFlow: subflows/rewind_harbor_lights.yaml
# Listening long enough for a save or two.
- extendedWaitUntil:
    visible:
      id: player.position
      text: ".*0:(1[2-9]|[2-5][0-9])"
    timeout: 40000
- copyTextFrom:
    id: player.position
- evalScript: ${output.beforeKill = maestro.copiedText}
- evalScript: ${output.seenAt = Date.now()}

# Killed while playing: only the saves every five seconds kept the place.
- stopApp
- evalScript: ${output.killedAt = Date.now()}
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: miniplayer.open
    timeout: 30000
- tapOn:
    id: miniplayer.open
- extendedWaitUntil:
    visible:
      id: player.position
    timeout: 30000
- copyTextFrom:
    id: player.position
- evalScript: ${output.afterRelaunch = maestro.copiedText}
# Relaunching syncs what the last save kept; the script polls the server
# until it lands.
- runScript:
    file: scripts/assert_resumed.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server check passed
