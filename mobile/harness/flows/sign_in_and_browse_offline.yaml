# Sign in, see a Book, go offline, and still see it (#911). The harness
# passes APP_ID, SERVER (as the device reaches the Shisho server), USERNAME,
# PASSWORD, and CONTROL (the harness's own endpoint). The flow runs
# unchanged on every platform's app.
appId: ${APP_ID}
name: Sign in and browse Books offline
---
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml

# The Library comes from the device's copy of the catalog.
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- extendedWaitUntil:
    visible: The Harness Novel
    timeout: 15000
- assertVisible: Quiet Lighthouse

# Book detail
- tapOn: The Harness Novel
- assertVisible:
    id: book.detail.title
    text: The Harness Novel
- assertVisible:
    id: book.detail.authors
    text: .*Ada Writer.*
- back

# Offline: the server goes away, the app is closed and opened again, and
# the Library is still there.
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 15000
- assertVisible: The Harness Novel
- assertVisible: Quiet Lighthouse
- extendedWaitUntil:
    visible:
      id: sync.banner
    timeout: 30000
- tapOn: The Harness Novel
- assertVisible:
    id: book.detail.authors
    text: .*Ada Writer.*
