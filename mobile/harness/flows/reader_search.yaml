# Search inside the Book, see each result in its sentence under its
# chapter, open one, and land on it; next and previous step through the
# rest (#920).
appId: ${APP_ID}
name: Search inside the Book and jump to a result
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter One
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.search
# The field has the keyboard as the sheet opens, and the sheet keeps its
# title and Done while it does. Each chapter has one ninth paragraph.
- extendedWaitUntil:
    visible:
      id: reader.search.field
    timeout: 30000
- inputText: paragraph 9
- assertVisible:
    id: reader.search.done
- extendedWaitUntil:
    visible:
      id: reader.search.status
      text: 3 results
    timeout: 30000
- assertVisible: Chapter Three
- tapOn:
    id: reader.search.result
    text: "Chapter Three, paragraph 9.*"
- extendedWaitUntil:
    visible:
      id: reader.search.position
      text: 3 of 3
    timeout: 30000
# Landing hides the controls, and the find bar takes the readout's place,
# so the controls show the place.
- runFlow: subflows/show_reader_controls.yaml
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Three.*"
    timeout: 30000
# Next wraps to the first result, in Chapter One.
- tapOn:
    id: reader.search.next
- extendedWaitUntil:
    visible:
      id: reader.search.position
      text: 1 of 3
    timeout: 30000
- runFlow: subflows/show_reader_controls.yaml
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter One.*"
    timeout: 30000
# Closing the search takes its bar away.
- tapOn:
    id: reader.search.close
- extendedWaitUntil:
    notVisible:
      id: reader.search.position
    timeout: 30000
