# Signing out sends what the app hasn't sent yet first, so signing in again
# after the server was set up from scratch rarely has anything to lose. With
# the server unreachable, signing out doesn't wait on it, and signing in
# again sends what it kept (#967).
appId: ${APP_ID}
name: Sign out sends unsent changes
onFlowComplete:
  - runScript:
      file: scripts/go_online.js
      env:
        CONTROL: ${CONTROL}
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runScript:
    file: scripts/note_bookmarks.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000

# A Bookmark made while the server is unreachable waits in the journal, and
# coming back starts no sync, so only signing out sends it.
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- tapOn:
    id: player.bookmark
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- tapOn:
    id: player.close
# The Library tab, tapped again, goes back to its first screen, where Account
# is.
- tapOn:
    id: tab.library
- tapOn:
    id: account.button
# The Account sheet opens at half height, with Sign Out further down.
- scrollUntilVisible:
    element:
      id: account.signOut
    direction: DOWN
    timeout: 30000
- tapOn:
    id: account.signOut
- tapOn:
    id: account.signOut.confirm
- extendedWaitUntil:
    visible:
      id: signin.server
    timeout: 60000
- runScript:
    file: scripts/assert_new_bookmark.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The Bookmark reached the server before signing out

# With the server unreachable, signing out goes ahead at once and keeps the
# change, which signing in again sends.
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000
- runScript:
    file: scripts/note_bookmarks.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- tapOn:
    id: player.bookmark
- tapOn:
    id: player.close
# The Library tab, tapped again, goes back to its first screen, where Account
# is.
- tapOn:
    id: tab.library
- tapOn:
    id: account.button
# The Account sheet opens at half height, with Sign Out further down.
- scrollUntilVisible:
    element:
      id: account.signOut
    direction: DOWN
    timeout: 30000
- tapOn:
    id: account.signOut
- tapOn:
    id: account.signOut.confirm
- extendedWaitUntil:
    visible:
      id: signin.server
    timeout: 30000

# Signing in again to the same server keeps the account, and sends the
# change it kept.
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/sign_in.yaml
- runScript:
    file: scripts/assert_new_bookmark.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The kept Bookmark reached the server after signing in again
