# With the server offline, mark a Book read, queue two Books on To Read, and
# make a List with a Book in it. The server comes back refusing the app's
# protocol, first as too new for the app and then as too old for it: the
# banner says which, and the app keeps working, moving the second Book to
# the top of To Read meanwhile (#906). Once the server accepts the app
# again, it has each change as it was left (#918).
appId: ${APP_ID}
name: Change the reading record offline, then sync
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runScript:
    file: scripts/reset_record.js
    env:
      CONTROL: ${CONTROL}
      TITLES: Harness Manual,Harness Manga,Harness Webtoon
      LISTS: Offline Picks
- runFlow: subflows/launch_signed_in.yaml
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}

- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: Harness Manual
- runFlow:
    file: subflows/set_status.yaml
    env:
      ITEM: Mark as read
      STATUS: Read
- tapOn:
    id: tab.library
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: Harness Manga
- runFlow:
    file: subflows/set_status.yaml
    env:
      ITEM: Add to To Read
      STATUS: To Read
- tapOn:
    id: tab.library
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: Harness Webtoon
- runFlow:
    file: subflows/set_status.yaml
    env:
      ITEM: Add to To Read
      STATUS: To Read

# A new List, made from the Book's page with the Book in it.
- tapOn:
    id: book.detail.addToList
- tapOn:
    id: addToList.new
- tapOn:
    id: listForm.name
- inputText: Offline Picks
# A stall can drop typed text: typed again while the field doesn't hold it.
- repeat:
    while:
      notVisible:
        id: listForm.name
        text: Offline Picks
    times: 3
    commands:
      - eraseText
      - inputText: Offline Picks
- tapOn:
    id: listForm.save
- extendedWaitUntil:
    visible:
      id: addToList.row
      text: ".*Offline Picks.*"
    timeout: 30000
- tapOn:
    id: addToList.done

# The server is back but too new for the app, and a refresh on Home says
# so.
- runScript:
    file: scripts/accept_app_protocols.js
    env:
      CONTROL: ${CONTROL}
      RANGE: 2-2
- tapOn:
    id: tab.home
# TEMPORARY: the banner shows only on the Library tab until it moves above
# the tabs, app-wide; then remove each step marked TEMPORARY, and
# subflows/library_root.yaml.
- runFlow: subflows/library_root.yaml # TEMPORARY
- runFlow:
    file: subflows/refresh_until.yaml
    env:
      TEXT: ".*too old for this server.*"
# The card holds the text, so the two are found apart.
- assertVisible:
    id: sync.banner
- tapOn: # TEMPORARY
    id: tab.home
    retryTapIfNoChange: true

# The second Book queued moves to the top while the server refuses the app.
- tapOn:
    id: home.toRead.header
- extendedWaitUntil:
    visible:
      id: toRead.row
      text: ".*Harness Webtoon.*"
    timeout: 30000
- longPressOn:
    id: toRead.row
    text: ".*Harness Webtoon.*"
- tapOn:
    text: Move to Top
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: toRead.row
      text: "1.*Harness Webtoon.*"
    timeout: 30000

# A server too old for the app refuses it the other way.
- runScript:
    file: scripts/accept_app_protocols.js
    env:
      CONTROL: ${CONTROL}
      RANGE: 0-0
- runFlow: subflows/library_root.yaml # TEMPORARY
- runFlow:
    file: subflows/refresh_until.yaml
    env:
      TEXT: ".*too old for this version of the app.*"
- assertVisible:
    id: sync.banner
- tapOn: # TEMPORARY
    id: tab.home
    retryTapIfNoChange: true

# Accepted again, a refresh syncs; the script polls the server until it
# lands.
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- runScript:
    file: scripts/assert_record.js
    env:
      CONTROL: ${CONTROL}
      READ: Harness Manual
      TO_READ: Harness Webtoon,Harness Manga
      LIST: Offline Picks
      LIST_BOOK: Harness Webtoon
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: What changed offline reached the server as it was left
# The banner goes once a sync goes through.
- runFlow: subflows/library_root.yaml # TEMPORARY
- extendedWaitUntil:
    notVisible:
      id: sync.banner
    timeout: 30000
