# Add a Bookmark with a note while the server is offline. It shows at once,
# and reaches the server, placed when it was made, once the app can sync
# (#916).
appId: ${APP_ID}
name: Bookmark offline and sync later
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}

# Bookmark adds one where playback is at once, and offers a note.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.bookmark
- tapOn:
    id: bookmark.addNote
# The note's field is in an alert, found by what it says.
- tapOn: Note
- inputText: Made offline
- tapOn: Save
# The list is a tab of the chapters sheet.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.chapters
- tapOn:
    id: list.bookmarks
- assertVisible: .*Made offline.*
- tapOn:
    id: list.done

# Opened again once the server is back, the app syncs what it kept.
- stopApp
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp
- extendedWaitUntil:
    visible:
      id: miniplayer.open
    timeout: 30000
# Checked in a retry, since the sync can take longer than one wait on a
# loaded CI simulator.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: __never__
          timeout: 5000
          optional: true
      - runScript:
          file: scripts/assert_bookmark.js
          env:
            CONTROL: ${CONTROL}
            TITLE: Harbor Lights
            NOTE: Made offline
      - assertTrue:
          condition: ${output.serverCheck == "ok"}
          label: The server check passed
