# Import a font from Files and remove it, change the text size in a run that
# lands back on its page, and read in scrolled layout (#919, #920). The
# settings' steps and limits, the values the page gets, and their being kept
# are ReaderSettingsTests' to check.
appId: ${APP_ID}
name: Import a font, resize in place, and read scrolled
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter Two
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.settings

# A font imported from Files is chosen. Removed, it's gone, and the book is
# back in its own font. That it's kept on the device is ReaderFontsTests' to
# check.
- tapOn:
    id: reader.font
- scrollUntilVisible:
    element:
      id: reader.font.import
    direction: DOWN
    timeout: 30000
- tapOn:
    id: reader.font.import
- runFlow: subflows/pick_harness_font.yaml
- extendedWaitUntil:
    visible:
      text: Harness Font
      selected: true
    timeout: 30000
- scrollUntilVisible:
    element:
      id: reader.font.remove
    direction: DOWN
    timeout: 30000
- tapOn:
    id: reader.font.remove
- extendedWaitUntil:
    notVisible:
      id: reader.font.remove
    timeout: 30000
- assertNotVisible: Harness Font
- scrollUntilVisible:
    element:
      id: reader.font.book
    direction: UP
    timeout: 30000
- assertVisible:
    id: reader.font.book
    selected: true
- tapOn:
    id: reader.settings.done
- extendedWaitUntil:
    notVisible:
      id: reader.settings.done
    timeout: 30000

# A few pages in, a run of changes that ends at the size it started at
# lands on the page it started on: each change keeps the place the first
# one pinned, rather than walking back a little at a time.
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- runFlow: subflows/settled_place.yaml
- evalScript: ${output.beforeRun = output.settledPlace}
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.settings
- tapOn:
    id: reader.size.increase
- extendedWaitUntil:
    visible:
      id: reader.size.value
      text: 16.5 px
    timeout: 30000
- tapOn:
    id: reader.size.increase
- extendedWaitUntil:
    visible:
      id: reader.size.value
      text: 17 px
    timeout: 30000
- tapOn:
    id: reader.size.decrease
- extendedWaitUntil:
    visible:
      id: reader.size.value
      text: 16.5 px
    timeout: 30000
- tapOn:
    id: reader.size.decrease
- extendedWaitUntil:
    visible:
      id: reader.size.value
      text: 16 px
    timeout: 30000
- tapOn:
    id: reader.settings.done
- extendedWaitUntil:
    notVisible:
      id: reader.settings.done
    timeout: 30000
- runFlow: subflows/settled_place.yaml
- assertTrue:
    condition: ${output.settledPlace == output.beforeRun}
    label: The run of changes ended on the page it started on

# Last, since the layout stays scrolled: switched to scrolled layout and
# scrolled into the next chapter, the place follows the scroll. A sideways
# swipe and a pull past a chapter's start go to the chapter beside.
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.settings
# Below the fold of the half-height sheet.
- scrollUntilVisible:
    element:
      id: reader.layout.scrolled
    direction: DOWN
    timeout: 30000
- tapOn:
    id: reader.layout.scrolled
- tapOn:
    id: reader.settings.done
- extendedWaitUntil:
    notVisible:
      id: reader.settings.done
    timeout: 30000
# Switching the layout keeps the place.
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Two.*"
    timeout: 30000
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter One
- repeat:
    while:
      notVisible:
        id: reader.progress
        text: "Chapter Two.*"
    times: 60
    commands:
      - swipe:
          start: "50%,75%"
          end: "50%,20%"
          duration: 300
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Two.*"
    timeout: 30000
# A swipe sideways goes to the chapter beside, and back.
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Three.*"
    timeout: 30000
- swipe:
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Two.*"
    timeout: 30000
# A little way into Chapter Two, one long pull down scrolls back to its
# start and goes on past it, which brings Chapter One back in, as a pull at
# the end goes on into the next.
- swipe:
    start: "50%,60%"
    end: "50%,45%"
    duration: 600
- swipe:
    start: "50%,10%"
    end: "50%,95%"
    duration: 1500
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter One.*"
    timeout: 30000
