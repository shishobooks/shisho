# Share a File out of the app from its page: the server prepares it with
# Shisho's current metadata, and the system share sheet opens with it
# (#915). What's in the file is covered by the server's handler tests.
appId: ${APP_ID}
name: Share a File
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: Quiet Lighthouse
- scrollUntilVisible:
    element:
      id: file\.open\.[0-9]+
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: file\.open\.[0-9]+
- extendedWaitUntil:
    visible:
      id: file.share
    timeout: 30000
- tapOn:
    id: file.share
- extendedWaitUntil:
    visible: Save to Files
    timeout: 60000
