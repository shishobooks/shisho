# Pause, and the session so far reaches the server. Then listen while the
# server is offline and reconnect: the session reaches the server placed at
# the time it happened, not when it synced (#912).
appId: ${APP_ID}
name: Listen offline and sync later
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runScript:
    file: scripts/note_app_sessions.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harbor Lights
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
# Another flow may have listened already: start from the beginning.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.prevChapter
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.prevChapter
# A few seconds online, so the player buffers the whole (small) File.
- extendedWaitUntil:
    visible:
      id: player.position
      text: ".*0:(0[4-9]|[1-5][0-9])"
    timeout: 30000
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- copyTextFrom:
    id: player.position
- evalScript: ${output.onlinePaused = maestro.copiedText}
- runScript:
    file: scripts/note_online_pause.js
# The pause sends the session so far. Checked in a retry, since the sync can
# take longer than one wait on a loaded CI simulator.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: __never__
          timeout: 4000
          optional: true
      - runScript:
          file: scripts/assert_paused_session.js
          env:
            CONTROL: ${CONTROL}
            TITLE: Harbor Lights
      - assertTrue:
          condition: ${output.serverCheck == "ok"}
          label: The server check passed
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}

# Listening offline.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
# Until the place is well past where it paused online.
- extendedWaitUntil:
    visible:
      id: player.position
      text: ${output.offlineTarget}
    timeout: 60000
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- copyTextFrom:
    id: player.position
- evalScript: ${output.paused = maestro.copiedText}

# The app is closed, which ends the session, and opened once the server is
# back: what it kept offline syncs.
- stopApp
- extendedWaitUntil:
    visible: __never__
    timeout: 3000
    optional: true
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp
- extendedWaitUntil:
    visible:
      id: miniplayer.open
    timeout: 30000
# Checked in a retry, since the sync can take longer than one wait on a
# loaded CI simulator.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: __never__
          timeout: 6000
          optional: true
      - runScript:
          file: scripts/assert_offline_session.js
          env:
            CONTROL: ${CONTROL}
            TITLE: Harbor Lights
      - assertTrue:
          condition: ${output.serverCheck == "ok"}
          label: The server check passed
