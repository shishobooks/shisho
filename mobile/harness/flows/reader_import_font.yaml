# Import a font from Files, which the book is then read in, and remove it
# (#920). That it's kept on the device is ReaderFontsTests' to check.
appId: ${APP_ID}
name: Import a font from Files and remove it
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.settings
- tapOn:
    id: reader.font
- scrollUntilVisible:
    element:
      id: reader.font.import
    direction: DOWN
    timeout: 30000
- tapOn:
    id: reader.font.import
- runFlow: subflows/pick_harness_font.yaml
# Imported, it's chosen.
- extendedWaitUntil:
    visible:
      text: Harness Font
      selected: true
    timeout: 30000
# Removed, it's gone, and the book is back in its own font.
- scrollUntilVisible:
    element:
      id: reader.font.remove
    direction: DOWN
    timeout: 30000
- tapOn:
    id: reader.font.remove
- extendedWaitUntil:
    notVisible:
      id: reader.font.remove
    timeout: 30000
- assertNotVisible: Harness Font
- scrollUntilVisible:
    element:
      id: reader.font.book
    direction: UP
    timeout: 30000
- assertVisible:
    id: reader.font.book
    selected: true
