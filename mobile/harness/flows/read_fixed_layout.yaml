# A fixed-layout EPUB pages as foliate lays it out, as on the web: one page
# at a time on a portrait phone, each turn landing on the next page.
appId: ${APP_ID}
name: Turn the pages of a fixed-layout book
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: Harness Picture Book
- extendedWaitUntil:
    visible: "Fixed page 1 of the picture book."
    timeout: 30000
# One turn at a time, each swiped again only while the page still reads as
# the one before: a stalled runner can drop a swipe, and a second one sent
# blind after a late first could land past the page.
- evalScript: ${output.page = 1}
- repeat:
    while:
      true: ${output.page < 3}
    times: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: reader.progress
              text: "Page ${output.page + 1} · .*"
          commands:
            - swipe:
                direction: LEFT
            - extendedWaitUntil:
                visible:
                  id: reader.progress
                  text: "Page ${output.page + 1} · .*"
                timeout: 30000
                optional: true
      - runFlow:
          when:
            visible:
              id: reader.progress
              text: "Page ${output.page + 1} · .*"
          commands:
            - evalScript: ${output.page = output.page + 1}
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Page 3 · .*"
    timeout: 30000
- assertVisible: "Fixed page 3 of the picture book."
