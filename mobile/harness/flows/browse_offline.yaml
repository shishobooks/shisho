# See the Library, go offline, and still see it, search it for a person,
# and open a Book's page and a File's page (#911, #914). The harness passes
# APP_ID, SERVER (as the device reaches the Shisho server), USERNAME,
# PASSWORD, and CONTROL (the harness's own endpoint). The flow runs
# unchanged on every platform's app.
appId: ${APP_ID}
name: Browse Books offline
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml

# The Library comes from the device's copy of the catalog.
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- extendedWaitUntil:
    visible: The Harness Novel
    timeout: 30000
- assertVisible: Quiet Lighthouse

# Offline: the server goes away, the app is closed and opened again, and
# the Library is still there.
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- stopApp
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- assertVisible: The Harness Novel
- assertVisible: Quiet Lighthouse
- extendedWaitUntil:
    visible:
      id: sync.banner
    timeout: 30000

# Search finds a person in the device's own index, and their page lists
# their Books. Choosing the Library's tab again goes back to its top.
- tapOn:
    id: search.button
- tapOn: Books, series, people
- inputText: Ann Auth
- extendedWaitUntil:
    visible:
      id: search.person
      text: .*Ann Author.*
    timeout: 30000
- tapOn:
    id: search.person
# The person's own grid, which only their page has: the search's results
# list their Books too.
- extendedWaitUntil:
    visible:
      id: resource.grid
    timeout: 30000
- assertVisible: Harbor Lights
# A stalled CI simulator can drop the tap, so it's tapped again until the
# Library shows. A tap that lands on the Library itself only scrolls it to
# its top.
- repeat:
    while:
      notVisible:
        id: library.grid
    times: 3
    commands:
      - tapOn:
          id: tab.library
      - extendedWaitUntil:
          visible:
            id: library.grid
          timeout: 30000
          optional: true
- assertVisible:
    id: library.grid

- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: The Harness Novel
- assertVisible:
    id: book.detail.authors
    text: .*Ada Writer.*

# A File's page, from its row on the Book page, is on the device too.
- scrollUntilVisible:
    element:
      id: "file\\.open\\..*"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "file\\.open\\..*"
- assertVisible:
    id: file.from
    text: "From The Harness Novel.*"
- scrollUntilVisible:
    element: On disk
    direction: DOWN
