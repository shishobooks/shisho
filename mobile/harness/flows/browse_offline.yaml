# Sign in, see a Book, go offline, and still see it (#911). The harness
# passes APP_ID, SERVER (as the device reaches the Shisho server), USERNAME,
# PASSWORD, and CONTROL (the harness's own endpoint). The flow runs
# unchanged on every platform's app.
appId: ${APP_ID}
name: Sign in and browse Books offline
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow: subflows/sign_in.yaml

# The Library comes from the device's copy of the catalog.
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- extendedWaitUntil:
    visible: The Harness Novel
    timeout: 30000
- assertVisible: Quiet Lighthouse

# Book detail
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: The Harness Novel
- assertVisible:
    id: book.detail.title
    text: The Harness Novel
- assertVisible:
    id: book.detail.authors
    text: .*Ada Writer.*
- back

# Offline: the server goes away, the app is closed and opened again, and
# the Library is still there.
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- stopApp
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- assertVisible: The Harness Novel
- assertVisible: Quiet Lighthouse
- extendedWaitUntil:
    visible:
      id: sync.banner
    timeout: 30000
- runFlow:
    file: subflows/open_book.yaml
    env:
      TITLE: The Harness Novel
- assertVisible:
    id: book.detail.authors
    text: .*Ada Writer.*

# A File's page, from its row on the Book page, is on the device too.
- scrollUntilVisible:
    element:
      id: "file\\.open\\..*"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "file\\.open\\..*"
- assertVisible:
    id: file.from
    text: "From The Harness Novel.*"
- scrollUntilVisible:
    element: On disk
    direction: DOWN
