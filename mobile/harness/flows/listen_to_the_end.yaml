# Listen to a short audiobook to its end, then check the server: the place,
# a Reading Session attributed to the phone, and a finished Read-through
# (#912).
appId: ${APP_ID}
name: Listen to the end and check the server
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Quiet Lighthouse
# Playback ending stops the player, which syncs.
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000
# Chapters come from Shisho's list. Checked once the player has stopped on
# the last one: each chapter lasts only a few seconds, and a slow tap or view
# hierarchy read on CI can take longer than that.
- assertVisible:
    id: player.chapter
    text: Chapter 3
# The script polls the server until the sync lands.
- runScript:
    file: scripts/assert_listened.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Quiet Lighthouse
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server check passed
