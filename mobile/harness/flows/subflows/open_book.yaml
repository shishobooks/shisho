# Opens the Book titled ${TITLE} from the Library grid. Not a flow of its
# own. It scrolls the Book to the middle of the screen first: at the bottom
# a title can sit under the tab bar, which then takes the tap. The Library
# has more Books than a phone's screen shows, so the scroll is also what
# finds a Book further down, once the sync brings it.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
# From the grid's top, which the Library's tab scrolls it back to: a grid
# left scrolled down, as after opening a Book far down it, can leave the
# title under the header, where Maestro counts it as visible and its tap
# lands on the header's search button instead.
- tapOn:
    id: tab.library
# A Book in the last row can never reach the middle. Maestro then keeps
# swiping to center it before it settles for the Book being visible, which
# takes most of the default timeout, so one slow view hierarchy read fails the
# flow.
- scrollUntilVisible:
    element: ${TITLE}
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: ${TITLE}
# Maestro counts a title under the Library's header as visible, and a tap
# there lands on the header: when the Book's page hasn't opened, the title
# is centered again and tapped once more.
- extendedWaitUntil:
    visible:
      id: book.detail.title
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: book.detail.title
    commands:
      - scrollUntilVisible:
          element: ${TITLE}
          direction: UP
          centerElement: true
          timeout: 60000
      - tapOn: ${TITLE}
- extendedWaitUntil:
    visible:
      id: book.detail.title
    timeout: 30000
