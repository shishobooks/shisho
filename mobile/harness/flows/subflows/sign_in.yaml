# Signs in with the harness account. Not a flow of its own.
#
# Only the first field is tapped. Return moves to the next field and the
# last one submits, as the sign-in screen's focus order does, because a tap
# while the keyboard is still sliding in can land on the wrong field.
appId: ${APP_ID}
---
- tapOn:
    id: signin.server
- inputText: ${SERVER}
- pressKey: Enter
- inputText: ${USERNAME}
- pressKey: Enter
- inputText: ${PASSWORD}
# The harness's simulators disallow password AutoFill (tools/appharness), so
# iOS never offers to save the password, which would cover the app and stall
# Maestro.
- pressKey: Enter

# Signed in once the sign-in screen goes. A CI runner short of CPU can take
# most of a minute to answer, so this waits well past the usual 30 s.
- extendedWaitUntil:
    notVisible:
      id: signin.server
    timeout: 90000
    optional: true
# A busy CI runner can drop a typed character, which shows as an error: the
# wrong username or password, or a server that can't be reached. Then every
# field is typed again, once. Any other failure still fails the flow below.
- runFlow:
    when:
      visible:
        id: signin.error
    commands:
      - tapOn:
          id: signin.server
      - eraseText
      - inputText: ${SERVER}
      - pressKey: Enter
      - eraseText
      - inputText: ${USERNAME}
      - pressKey: Enter
      - eraseText
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          notVisible:
            id: signin.server
          timeout: 90000
          optional: true
- assertNotVisible:
    id: signin.server
