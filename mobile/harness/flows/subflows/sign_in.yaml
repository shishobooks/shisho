# Signs in with the harness account. Not a flow of its own.
#
# Only the first field is tapped. Return moves to the next field and the
# last one submits, as the sign-in screen's focus order does, because a tap
# while the keyboard is still sliding in can land on the wrong field.
appId: ${APP_ID}
---
- tapOn:
    id: signin.server
- inputText: ${SERVER}
- pressKey: Enter
- inputText: ${USERNAME}
- pressKey: Enter
- inputText: ${PASSWORD}
- pressKey: Enter
# The system may offer to save the password once the sign-in screen goes,
# which can take seconds on a busy CI runner, so wait for that first.
- extendedWaitUntil:
    notVisible:
      id: signin.submit
    timeout: 30000
- extendedWaitUntil:
    visible: Not Now
    timeout: 5000
    optional: true
- tapOn:
    text: Not Now
    optional: true
