# Taps ${CONTROL_ID}, a player control or one that starts playback. The
# position ticks while playing, so the tap waits only briefly for the screen
# to settle, and isn't repeated when the screen looks unchanged. Not a flow of
# its own.
appId: ${APP_ID}
---
- tapOn:
    id: ${CONTROL_ID}
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
