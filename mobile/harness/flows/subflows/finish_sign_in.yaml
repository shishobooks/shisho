# Waits until a sign-in submitted on the sign-in screen finishes, typing
# every field again once if it failed. Not a flow of its own.
appId: ${APP_ID}
---
# Signed in once the sign-in screen goes. A CI runner short of CPU can take
# most of a minute to answer, so this waits well past the usual 30 s.
- extendedWaitUntil:
    notVisible:
      id: signin.server
    timeout: 90000
    optional: true
# A busy CI runner can drop typed characters. Some dropped show as an error:
# the wrong username or password, or a server that can't be reached. A whole
# field dropped leaves Sign In disabled and no error at all. Either way the
# sign-in screen is still here, so every field is typed again, once. Any
# other failure still fails the flow below.
- runFlow:
    when:
      visible:
        id: signin.server
    commands:
      - tapOn:
          id: signin.server
      - eraseText
      - inputText: ${SERVER}
      - pressKey: Enter
      - eraseText
      - inputText: ${USERNAME}
      - pressKey: Enter
      - eraseText
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          notVisible:
            id: signin.server
          timeout: 90000
          optional: true
- assertNotVisible:
    id: signin.server
# The app opens on Home; the flows start from the Library.
- tapOn:
    id: tab.library
