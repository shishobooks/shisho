# Rewinds the open player to the start of Harbor Lights' first chapter, The
# Harbor, wherever another flow left the place, and plays from there. Not a
# flow of its own.
#
# "Previous chapter" goes back a chapter only within its first 3 seconds, and
# otherwise to the start of the one playing, so the player is paused while it
# skips back. A tap on a slow CI simulator can be lost or take effect late, so
# each play or pause tap waits for its result before trying again, and the
# rewind checks the place, not only the chapter: the sleep timer's flow leaves
# the place at the end of The Harbor.
appId: ${APP_ID}
---
- repeat:
    times: 3
    while:
      visible:
        id: player.playPause
        text: Pause
    commands:
      - runFlow:
          file: tap_player.yaml
          env:
            CONTROL_ID: player.playPause
      - extendedWaitUntil:
          visible:
            id: player.playPause
            text: Play
          timeout: 30000
          optional: true
- repeat:
    times: 4
    while:
      notVisible:
        id: player.chapter
        text: The Harbor
    commands:
      - runFlow:
          file: tap_player.yaml
          env:
            CONTROL_ID: player.prevChapter
# Now in The Harbor: to its start. Paused, the place holds still, so this
# checks a state that lasts.
- repeat:
    times: 4
    while:
      notVisible:
        id: player.position
        text: ".*[^0-9]0:0[0-2]"
    commands:
      - runFlow:
          file: tap_player.yaml
          env:
            CONTROL_ID: player.prevChapter
- assertVisible:
    id: player.chapter
    text: The Harbor
- assertVisible:
    id: player.position
    text: ".*[^0-9]0:0[0-2]"
- repeat:
    times: 3
    while:
      notVisible:
        id: player.playPause
        text: Pause
    commands:
      - runFlow:
          file: tap_player.yaml
          env:
            CONTROL_ID: player.playPause
      - extendedWaitUntil:
          visible:
            id: player.playPause
            text: Pause
          timeout: 30000
          optional: true
