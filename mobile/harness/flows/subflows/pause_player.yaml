# Pauses the open player and waits until it reads Play, so what follows
# sees a place that holds still. A tap on a slow CI simulator can be lost or
# take effect late, so it's tapped again only while the player still reads
# Pause, after waiting for the pause. The loop ends on a flag a `when` sets,
# since a `while` on an element takes about 7 s to give up on it once it
# goes. Not a flow of its own.
appId: ${APP_ID}
---
- evalScript: ${output.playerPaused = false}
- repeat:
    while:
      true: ${!output.playerPaused}
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: player.playPause
              text: Pause
          commands:
            - runFlow:
                file: tap_player.yaml
                env:
                  CONTROL_ID: player.playPause
      - extendedWaitUntil:
          visible:
            id: player.playPause
            text: Play
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: player.playPause
              text: Play
          commands:
            - evalScript: ${output.playerPaused = true}
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000
