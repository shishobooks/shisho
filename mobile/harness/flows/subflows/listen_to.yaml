# Opens the Book titled ${TITLE} from the Library and starts listening.
# Not a flow of its own.
appId: ${APP_ID}
---
- runFlow: open_book.yaml
- scrollUntilVisible:
    element:
      id: book.listen
    direction: DOWN
# Playback starts on the tap, so it's tapped as a player control.
- runFlow:
    file: tap_player.yaml
    env:
      CONTROL_ID: book.listen
- extendedWaitUntil:
    visible:
      id: player.chapter
    timeout: 30000
