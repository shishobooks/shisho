# Gives the first Bookmark in the open, paused player's list the note
# ${NOTE}, from the list, a tab of the chapters sheet, rather than the
# message offering one, which a stall could outlast. Not a flow of its own.
#
# The player is paused, so the screen holds still for plain taps, which
# Maestro taps again when nothing changes, and each waits for what it opens.
# A stall can drop typed text too, so the note is typed again until the list
# shows all of it. The loop ends on a flag a `when` sets, since a `while`
# on an element takes about 7 s to give up on it once the element shows.
appId: ${APP_ID}
---
- tapOn:
    id: player.chapters
- extendedWaitUntil:
    visible:
      id: list.bookmarks
    timeout: 30000
- tapOn:
    id: list.bookmarks
- extendedWaitUntil:
    visible:
      id: bookmarks.editNote
    timeout: 30000

- evalScript: ${output.noted = false}
- repeat:
    while:
      true: ${!output.noted}
    times: 3
    commands:
      # The note's field is in an alert, which names it.
      - tapOn:
          id: bookmarks.editNote
      - extendedWaitUntil:
          visible: Edit Note
          timeout: 30000
      # The alert opens with its field focused, so the note is typed with no
      # tap, over whatever a try before left.
      - eraseText
      - inputText: ${NOTE}
      - tapOn:
          id: bookmarks.save
      - extendedWaitUntil:
          notVisible: Edit Note
          timeout: 30000
      - extendedWaitUntil:
          visible: ".*${NOTE}.*"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: ".*${NOTE}.*"
          commands:
            - evalScript: ${output.noted = true}
- assertVisible: ".*${NOTE}.*"

- tapOn:
    id: list.done
- extendedWaitUntil:
    notVisible:
      id: list.done
    timeout: 30000
