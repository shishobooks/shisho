# Open a CBZ, turn three pages, kill the app, and reopen it at the same
# page with the server offline, so the page can only have come from the
# device; back online, the server has the place as a 0-based page (#921).
appId: ${APP_ID}
name: Read a comic, kill, and reopen at the same page
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
# No other flow reads this comic, so it opens at its first page. Opening it
# downloads it, so it opens again offline.
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: Harness Comic
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 1 of 8.*"
    timeout: 30000
- runScript:
    file: scripts/go_offline.js
    env:
      CONTROL: ${CONTROL}
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
# Every turn lands, none dropped, however long they queue.
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 4 of 8.*"
    timeout: 30000

# Killed: every turn already saved the page on the device.
- stopApp
- launchApp:
    stopApp: false
    permissions: {}
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: Harness Comic
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 4 of 8.*"
    timeout: 30000

# Back online, the place the turns saved reaches the server: closing the
# book sends it.
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.close
- runScript:
    file: scripts/assert_page_position.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harness Comic
      PAGE: "Page 4 of 8"
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server check passed
