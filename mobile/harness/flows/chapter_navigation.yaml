# Move through an audiobook by its chapters: the chapter list, and the
# previous and next chapter buttons (#916).
appId: ${APP_ID}
name: Navigate by chapter
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- launchApp:
    clearState: true
- runFlow: subflows/sign_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
# Paused before going on, so the chapter jumps land where they're checked.
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000

# The list goes to a chapter's start.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.chapters
- tapOn:
    id: chapters.row
    text: The Lights.*
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Lights
    timeout: 30000
- assertVisible:
    id: player.position
    text: .*0:00

# Previous chapter, just after a chapter starts, goes to the one before.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.prevChapter
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Harbor
    timeout: 30000
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.nextChapter
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Lights
    timeout: 30000
