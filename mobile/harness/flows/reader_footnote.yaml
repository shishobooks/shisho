# A picture opens on its own, the readout counts pages left in the chapter
# or the book, and Back returns from a jump from the contents. A small note
# reference opens its note in a card rather than turning the page, Go to
# Note goes to the note, and Back returns to where it left from (#919). Then
# search inside the Book, see each result in its sentence under its
# chapter, open one, and land on it; next steps through the rest, wrapping
# to the first (#920).
appId: ${APP_ID}
name: Open a picture and a footnote, go back, and search the Book
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter One
# The picture under Chapter One's heading opens on its own, and Close goes
# back to the page. Tapped by where it is, centered under the heading: the
# iOS 26 simulator gives the picture's element the wrong left edge, which
# puts its middle in the left third, where a tap turns the page.
# Once the jump has landed: the book may have opened in Chapter One, which
# the chapter's wait takes for the jump having landed, and a picture opens
# only on a page at rest.
- runFlow: subflows/settled_place.yaml
- extendedWaitUntil:
    visible: "A drawing in black lines"
    timeout: 30000
- tapOn:
    point: "50%,26%"
- extendedWaitUntil:
    visible:
      id: reader.image.close
    timeout: 30000
- tapOn:
    id: reader.image.close
- extendedWaitUntil:
    notVisible:
      id: reader.image.close
    timeout: 30000
- runFlow: subflows/show_reader_controls.yaml
# The bar counts the pages left in the chapter, and a tap counts the book's.
- extendedWaitUntil:
    visible:
      id: reader.pagesLeft
      text: ".* in chapter"
    timeout: 30000
- tapOn:
    id: reader.pagesLeft
- extendedWaitUntil:
    visible:
      id: reader.pagesLeft
      text: ".* in book"
    timeout: 30000
- tapOn:
    id: reader.contents
# A chapter can be tapped once the reader has found it in the book.
- extendedWaitUntil:
    visible:
      text: Chapter Two
      enabled: true
    timeout: 30000
- tapOn: Chapter Two
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Two.*"
    timeout: 30000
# Back returns from the jump, and the contents go to Chapter Two again.
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.back
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter One.*"
    timeout: 30000
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter Two
# The note reference, a link in the book's text.
- tapOn: "\\[1\\]"
- extendedWaitUntil:
    visible: ".*The footnote's text.*"
    timeout: 30000
- tapOn:
    id: reader.note.go
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Notes.*"
    timeout: 30000
# Back returns to where the jump left from.
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.back
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Two.*"
    timeout: 30000

- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.search
# The field has the keyboard as the sheet opens: the query is typed with
# no tap on the field, which only lands in a focused one. (Maestro doesn't
# report focus for it.) The sheet keeps its title and Done while it does.
# Each chapter has one ninth paragraph.
- extendedWaitUntil:
    visible:
      id: reader.search.field
    timeout: 30000
# A stall can drop typed text, so the query is typed again, over what's
# there, until its results show. The loop ends on a flag a `when` sets, since
# a `while` on an element takes about 7 s to give up on it once it shows.
- evalScript: ${output.resultsFound = false}
- repeat:
    while:
      true: ${!output.resultsFound}
    times: 3
    commands:
      - eraseText
      - inputText: paragraph 9
      - extendedWaitUntil:
          visible:
            id: reader.search.status
            text: 3 results
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible:
              id: reader.search.status
              text: 3 results
          commands:
            - evalScript: ${output.resultsFound = true}
- assertVisible:
    id: reader.search.done
- assertVisible:
    id: reader.search.status
    text: 3 results
- assertVisible: Chapter Three
- tapOn:
    id: reader.search.result
    text: "Chapter Three, paragraph 9.*"
- extendedWaitUntil:
    visible:
      id: reader.search.position
      text: 3 of 3
    timeout: 30000
# Landing hides the controls, and the find bar takes the readout's place,
# so the controls show the place.
- runFlow: subflows/show_reader_controls.yaml
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter Three.*"
    timeout: 30000
# Next wraps to the first result, in Chapter One.
- tapOn:
    id: reader.search.next
- extendedWaitUntil:
    visible:
      id: reader.search.position
      text: 1 of 3
    timeout: 30000
- runFlow: subflows/show_reader_controls.yaml
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: "Chapter One.*"
    timeout: 30000
# Closing the search takes its bar away.
- tapOn:
    id: reader.search.close
- extendedWaitUntil:
    notVisible:
      id: reader.search.position
    timeout: 30000
