# Speed steps by 0.1 and each audiobook File keeps its own, starting at 1x,
# and the time left is at that speed (#916).
appId: ${APP_ID}
name: Speed steps and is kept per File
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- assertVisible:
    id: player.speed
    text: .*1\.0x
- repeat:
    times: 4
    commands:
      - runFlow:
          file: subflows/tap_player.yaml
          env:
            CONTROL_ID: player.speedUp
- assertVisible:
    id: player.speed
    text: .*1\.4x
- assertVisible:
    id: player.left
    text: .* at 1\.4x

# Another audiobook starts at 1x and keeps a speed of its own. Switched to
# from the Library: choosing its tab again goes back to the Library's top.
- tapOn:
    id: player.close
- tapOn:
    id: tab.library
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Quiet Lighthouse
# Paused in its first chapter, as the flow that listens to its end expects.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- assertVisible:
    id: player.speed
    text: .*1\.0x
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.speedUp
- assertVisible:
    id: player.speed
    text: .*1\.1x
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.speedDown
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.speedDown
- assertVisible:
    id: player.speed
    text: .*0\.9x

# Back to the first, which kept its own.
# Opened again, the app starts on the Library, and speeds stay on the
# device.
- stopApp
- launchApp:
    stopApp: false
    permissions: {}
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- assertVisible:
    id: player.speed
    text: .*1\.4x
- assertVisible:
    id: player.left
    text: .* at 1\.4x
