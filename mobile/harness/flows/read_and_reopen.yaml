# Open an EPUB, turn a few pages, kill the app, and reopen it at the same
# place, its title naming the chapter there; the server has the place as a
# CFI too. Then read a page for a while, turn, read another, and close the
# reader: the Reading Session reaches the server with its time counted per
# page (#919).
#
# A comic goes through the same kill: its pages are the server's list of the
# archive's entries, read from the downloaded File, and it reopens at the
# page it was on, which the server has as a 0-based page; the flow chosen
# for it is saved on the server for the Book (#921).
appId: ${APP_ID}
name: Read an EPUB and a comic, kill, reopen at the same places, and send a Reading Session
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml

# No other flow reads the comic, so it opens at its first page.
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: Harness Comic
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 1 of 8.*"
    timeout: 30000
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
# Every turn lands, however long they queue.
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 4 of 8.*"
    timeout: 30000
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.close
- tapOn:
    id: tab.library
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000

- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
# From the start of Chapter One, wherever the flows before left the place.
- runFlow:
    file: subflows/go_to_chapter.yaml
    env:
      CHAPTER: Chapter One
# Once the jump has landed, as the place may have been in Chapter One.
- runFlow: subflows/settled_place.yaml
- evalScript: ${output.atOpen = output.settledPlace}
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
# Turns that queued behind a page being laid out land in a moment: the
# place is read once it reads the same twice in a row.
- runFlow: subflows/settled_place.yaml
- evalScript: ${output.beforeKill = output.settledPlace}
- assertTrue: ${output.beforeKill != output.atOpen}

# Killed: every turn already saved the place.
- stopApp
- evalScript: ${output.relaunchedAt = Date.now()}
- launchApp:
    stopApp: false
    permissions: {}
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: The Harness Novel
- extendedWaitUntil:
    visible: __never__
    timeout: 2000
    optional: true
- copyTextFrom:
    id: reader.progress
- evalScript: ${output.afterRelaunch = maestro.copiedText}
- assertTrue: ${output.beforeKill == output.afterRelaunch}
# The title names the chapter the book reopens in, before any turn: the
# chapter the place shows.
- evalScript: ${output.reopenedIn = output.afterRelaunch.split(' · ')[0]}
- assertTrue:
    condition: ${output.reopenedIn.startsWith('Chapter ')}
    label: The place names the chapter it reopened in
- runFlow: subflows/show_reader_controls.yaml
- extendedWaitUntil:
    visible:
      id: reader.title
      text: ${output.reopenedIn + '.*'}
    timeout: 30000
# Relaunching synced the place the turns saved, where the app showed it.
# The script polls the server until the sync lands.
- runScript:
    file: scripts/assert_read_position.js
    env:
      CONTROL: ${CONTROL}
      TITLE: The Harness Novel
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server check passed

# Each page counts from 5 seconds, and the session needs 10. The page
# reopened at has shown since the relaunch; the next counts once the turn
# has landed, so the flow waits for the place to move and settle first.
- extendedWaitUntil:
    visible: __never__
    timeout: 6000
    optional: true
# A stall can drop the turn, or land it after the place read as settled,
# so the flow turns again while the place still reads as the reopened page.
# Before turning again it waits a stall's length and looks once more, so a
# late first turn doesn't get a second one queued behind it.
- evalScript: ${output.secondPage = output.afterRelaunch}
- evalScript: ${output.turns = 0}
- repeat:
    while:
      true: ${output.secondPage == output.afterRelaunch}
    times: 3
    commands:
      - runFlow:
          when:
            true: ${output.turns > 0}
          commands:
            - extendedWaitUntil:
                visible: __never__
                timeout: 10000
                optional: true
            - runFlow: subflows/settled_place.yaml
            - evalScript: ${output.secondPage = output.settledPlace}
      - runFlow:
          when:
            true: ${output.secondPage == output.afterRelaunch}
          commands:
            - swipe:
                direction: LEFT
            - evalScript: ${output.turns = output.turns + 1}
            - runFlow: subflows/settled_place.yaml
            - evalScript: ${output.secondPage = output.settledPlace}
- assertTrue:
    condition: ${output.secondPage != output.afterRelaunch}
    label: The turn landed on the next page
- extendedWaitUntil:
    visible: __never__
    timeout: 7000
    optional: true
- evalScript: ${output.dwellEnded = Date.now()}
- runFlow: subflows/show_reader_controls.yaml
# Closing ends the session, which syncs.
- tapOn:
    id: reader.close
- extendedWaitUntil:
    visible:
      id: book.read
    timeout: 30000
# The script polls the server until the sync lands, for a session that
# started after the relaunch and ended after the second page's wait (the
# one from before the kill can reach the server after the place does), with
# the place on the second page.
- runScript:
    file: scripts/assert_read_session.js
    env:
      CONTROL: ${CONTROL}
      TITLE: The Harness Novel
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server check passed

# The comic reopens at its page after the kill, and the server has the
# place as a 0-based page.
- tapOn:
    id: tab.library
- extendedWaitUntil:
    visible:
      id: library.grid
    timeout: 30000
- runFlow:
    file: subflows/read.yaml
    env:
      TITLE: Harness Comic
- extendedWaitUntil:
    visible:
      id: reader.progress
      text: ".*Page 4 of 8.*"
    timeout: 30000
- runScript:
    file: scripts/assert_page_position.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harness Comic
      PAGE: "Page 4 of 8"
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server has the comic's page
# The flow chosen here is the Book's, on the server, so the web reads it
# that way too.
- runFlow: subflows/show_reader_controls.yaml
- tapOn:
    id: reader.settings
- tapOn:
    id: reader.flow.scrolled
- extendedWaitUntil:
    visible: Saved for this book.
    timeout: 30000
- tapOn:
    id: reader.settings.done
- runScript:
    file: scripts/assert_page_flow.js
    env:
      CONTROL: ${CONTROL}
      TITLE: Harness Comic
      FLOW: scrolled
- assertTrue:
    condition: ${output.serverCheck == "ok"}
    label: The server keeps the flow
