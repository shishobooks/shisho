# A sleep timer set to the end of the chapter stops playback there, ready
# to play the next chapter from its start, and the chapter buttons move from
# there (#916). It plays the last 30 seconds of Harbor Lights' first chapter,
# so a stall on CI can't carry playback past the next boundary before the
# timer sees this one.
appId: ${APP_ID}
name: Sleep at the end of the chapter
---
- runScript:
    file: scripts/go_online.js
    env:
      CONTROL: ${CONTROL}
- runFlow: subflows/launch_signed_in.yaml
- runFlow:
    file: subflows/listen_to.yaml
    env:
      TITLE: Harbor Lights
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
# Paused before going on, so the places below are where they're checked.
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 30000
# 30 seconds before the first chapter ends: the second's start, skipped back.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.chapters
- tapOn:
    id: chapters.row
    text: The Lights.*
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Lights
    timeout: 30000
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.skipBack
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Harbor
    timeout: 30000

- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.sleep
- tapOn: End of Chapter
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
# The timer stops playback at the boundary, about 30 seconds on.
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Play
    timeout: 90000
- assertVisible:
    id: player.chapter
    text: The Lights
- assertVisible:
    id: player.position
    text: .*0:00

# Stopped at a chapter's start, the chapter buttons move through the File's
# chapters: Previous goes to the one before, and Next comes back.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.prevChapter
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Harbor
    timeout: 30000
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.nextChapter
- extendedWaitUntil:
    visible:
      id: player.chapter
      text: The Lights
    timeout: 30000

# Playing again goes on into the next chapter.
- runFlow:
    file: subflows/tap_player.yaml
    env:
      CONTROL_ID: player.playPause
- extendedWaitUntil:
    visible:
      id: player.playPause
      text: Pause
    timeout: 30000
