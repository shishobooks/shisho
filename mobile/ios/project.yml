# The Shisho app for iPhone and iPad. XcodeGen makes Shisho.xcodeproj from
# this file (`mise ios:generate`); the project itself isn't committed.
name: Shisho
options:
  bundleIdPrefix: com.shishobooks
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  ShishoAPI:
    path: ShishoAPI
  # The app's SQLite layer: migrations, observation, and a pool of readers
  # beside one writer. Pinned exactly; the resolved file lives in the
  # generated project, which isn't committed.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  Shisho:
    type: application
    platform: iOS
    sources:
      - path: Shisho
        excludes:
          - Reader/ReaderWeb
      # The reader's page and script, and the web reader's vendored
      # foliate-js, which lays out Reflowable Files (ADR 0026). Both are
      # folders in the bundle, so the script imports ../foliate/view.js.
      - path: Shisho/Reader/ReaderWeb
        type: folder
        buildPhase: resources
      - path: ../../app/libraries/foliate
        type: folder
        buildPhase: resources
      # The web reader's bundled fonts, with their licenses, which the
      # reader's page loads from fonts/ when one is chosen.
      - path: ../../app/assets/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: ShishoAPI
      - package: GRDB
    info:
      path: Shisho/Info.plist
      properties:
        CFBundleDisplayName: $(SHISHO_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Geist.ttf
          - GeistMono.ttf
          - ShishoWordmark-Bold.ttf
          - ShishoWordmarkJP-Regular.ttf
        # Plain HTTP only to the local network; everything else is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Shisho connects to your Shisho server when it's on your local network.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          # The phone's own scene is SwiftUI's; CarPlay's is this one, which
          # iOS can connect with the phone's screen never shown.
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # Audiobooks play with the phone locked, and a background refresh
        # sends listening done offline (AppModel.refreshTaskID).
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        # WOFF2 fonts, which iOS has no type for, so the reader can import
        # them from Files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.w3.woff2
            UTTypeDescription: WOFF2 Font
            UTTypeConformsTo:
              - public.font
            UTTypeTagSpecification:
              public.filename-extension:
                - woff2
              public.mime-type:
                - font/woff2
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHISHO_BUNDLE_ID)$(SHISHO_BUNDLE_ID_SUFFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: $(SHISHO_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(SHISHO_APP_ICON)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ShishoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShishoTests
    dependencies:
      - target: Shisho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHISHO_BUNDLE_ID)$(SHISHO_BUNDLE_ID_SUFFIX).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shisho:
    build:
      targets:
        Shisho: all
    test:
      targets:
        - ShishoTests
    run:
      config: Debug
