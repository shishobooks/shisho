<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 2500px;
        height: 625px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse 60% 120% at center,
          #333336 0%,
          #1a1a1c 60%,
          #121214 100%
        );
        position: relative;
        overflow: hidden;
      }
      /* Subtle purple glow */
      body::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1100px;
        height: 520px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          ellipse at center,
          rgba(139, 92, 246, 0.16) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }
      .logo {
        font-family: "Noto Sans", sans-serif;
        font-weight: 700;
        font-size: 150px;
        letter-spacing: 0.04em;
        color: #fafafa;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: baseline;
        gap: 24px;
        line-height: 1;
      }
      .icon {
        width: 128px;
        height: 128px;
        /* shelf sits on the text baseline */
        transform: translateY(12px);
      }
      .kanji {
        font-weight: 400;
        font-size: 84px;
        color: #c4b5fd;
        letter-spacing: 0.08em;
        margin-left: 10px;
        vertical-align: top;
        position: relative;
        top: 19px;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg
        class="icon"
        viewBox="0 0 48 48"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="shelf-contact" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0" />
            <stop offset="1" stop-color="#000" stop-opacity="0.28" />
          </linearGradient>
          <linearGradient id="shelf-shade" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0" />
            <stop offset="1" stop-color="#000" stop-opacity="0.3" />
          </linearGradient>
        </defs>
        <!-- shelf -->
        <rect fill="#c4b5fd" height="4" rx="1" width="40" x="4" y="40" />
        <rect
          fill="#fff"
          height="1"
          opacity="0.28"
          rx="0.5"
          width="38"
          x="5"
          y="40"
        />
        <rect
          fill="url(#shelf-shade)"
          height="4"
          rx="1"
          width="40"
          x="4"
          y="40"
        />
        <!-- books: base, spine highlight, title band, contact shadow -->
        <g>
          <rect fill="#c4b5fd" height="28" rx="1" width="7" x="8" y="12" />
          <rect
            fill="#fff"
            height="26"
            opacity="0.28"
            rx="0.5"
            width="1"
            x="8"
            y="13"
          />
          <rect
            fill="#fff"
            height="1"
            opacity="0.35"
            rx="0.5"
            width="5"
            x="9"
            y="16"
          />
          <rect
            fill="url(#shelf-contact)"
            height="7"
            rx="1"
            width="7"
            x="8"
            y="33"
          />
        </g>
        <g opacity="0.7">
          <rect fill="#c4b5fd" height="32" rx="1" width="6" x="17" y="8" />
          <rect
            fill="#fff"
            height="30"
            opacity="0.28"
            rx="0.5"
            width="1"
            x="17"
            y="9"
          />
          <rect
            fill="#fff"
            height="1"
            opacity="0.35"
            rx="0.5"
            width="4"
            x="18"
            y="12"
          />
          <rect
            fill="url(#shelf-contact)"
            height="7"
            rx="1"
            width="6"
            x="17"
            y="33"
          />
        </g>
        <g>
          <rect fill="#c4b5fd" height="24" rx="1" width="8" x="25" y="16" />
          <rect
            fill="#fff"
            height="22"
            opacity="0.28"
            rx="0.5"
            width="1"
            x="25"
            y="17"
          />
          <rect
            fill="#fff"
            height="1"
            opacity="0.35"
            rx="0.5"
            width="6"
            x="26"
            y="20"
          />
          <rect
            fill="url(#shelf-contact)"
            height="7"
            rx="1"
            width="8"
            x="25"
            y="33"
          />
        </g>
        <g opacity="0.7">
          <rect fill="#c4b5fd" height="30" rx="1" width="5" x="35" y="10" />
          <rect
            fill="#fff"
            height="28"
            opacity="0.28"
            rx="0.5"
            width="1"
            x="35"
            y="11"
          />
          <rect
            fill="#fff"
            height="1"
            opacity="0.35"
            rx="0.5"
            width="3"
            x="36"
            y="14"
          />
          <rect
            fill="url(#shelf-contact)"
            height="7"
            rx="1"
            width="5"
            x="35"
            y="33"
          />
        </g>
      </svg>
      <span>Shisho<span class="kanji">司書</span></span>
    </div>
  </body>
</html>
